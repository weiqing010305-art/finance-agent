<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接受邀请 · FinScope</title>
  <link rel="stylesheet" href="./formal-console.css">
  <script src="./invitation.js" defer></script>
</head>
<body>
  <div class="grain"></div>
  <header class="masthead"><a class="brand" href="./formal-console.html">FINSCOPE <span>/ 邀请加入</span></a></header>
  <main class="login-view">
    <aside class="editorial-mark"><span>→</span><p>SECURE<br>ONE-TIME<br>INVITATION</p></aside>
    <section class="login-card">
      <p class="eyebrow">TENANT ONBOARDING</p>
      <h1>设置你的<br>登录密码。</h1>
      <form id="invitation-form">
        <label>密码（至少 12 位）<input id="invite-password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
        <label>确认密码<input id="invite-password-confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
        <button class="primary" type="submit"><span>接受邀请</span><span>→</span></button>
        <p id="invitation-error" class="error" role="alert"></p>
      </form>
    </section>
  </main>
  <footer><span>邀请令牌仅在本页内存中使用，不写入浏览器存储。</span></footer>
</body>
</html>
